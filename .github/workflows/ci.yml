name: tests

# The light half of the suite: Table 1 reproduced from the committed 110 kB
# bundle, plus import and path hygiene. Stdlib and (at most) NumPy, no network,
# no GPU, a few seconds.
#
# What this workflow deliberately does NOT do
# -------------------------------------------
# It never installs the science stack. JAX, TensorFlow, Torch, healpy, sbi_lens
# and wl_stats_torch are multi-gigabyte, several of them need CUDA, and none of
# them can do anything useful on a runner with no GPU and no data bundle. A
# workflow that tried would be red forever and would teach everyone to ignore
# it. Tests needing any of that are marked `heavy` (see tests/conftest.py) and
# are excluded here with `-m "not heavy"`; they are run by hand on a machine
# with the Zenodo bundle and a GPU.
#
# The package is used from `src/` via PYTHONPATH rather than installed, so a
# green run means "these tests pass against the source tree as committed", with
# no build step to hide behind.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The range pyproject.toml declares: requires-python = ">=3.10,<3.13".
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test-only dependencies
        # pytest to run the suite, numpy because a handful of light modules
        # import it. Nothing else: no GPU stack, no data download.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=7.0" "numpy>=1.24"

      - name: Show the environment
        run: |
          python --version
          python -m pip list

      - name: Run the light test suite
        env:
          PYTHONPATH: src
        # --strict-markers so a typo'd `heavy` marker fails loudly instead of
        # silently letting a heavy test run here.
        run: python -m pytest tests/ -q --strict-markers -m "not heavy"

      - name: Run the suite without pytest
        # tests/_runner.py lets every test module run as a plain script, for
        # environments that have no pytest. Exercised here so it cannot rot.
        env:
          PYTHONPATH: src
        run: |
          python tests/test_table1.py
          python tests/test_imports.py
          python tests/test_paths.py

  stdlib-only:
    name: pytest with no NumPy (the "import nn_l1_sbi is cheap" claim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest and nothing else
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=7.0"

      - name: Assert NumPy really is absent
        # A runner image that ships NumPy would make this job prove nothing, so
        # remove it if it is there and then check, rather than trusting the image.
        run: |
          python -m pip uninstall -y numpy || true
          if python -c "import numpy" 2>/dev/null; then
            echo "NumPy is still importable; this job would prove nothing." >&2
            exit 1
          fi
          echo "NumPy absent, as intended."

      - name: Table 1, imports and paths on a bare interpreter
        env:
          PYTHONPATH: src
        # The whole Table-1 reproduction, the path resolver and the light-module
        # import check must pass with the standard library alone.
        run: python -m pytest tests/ -q --strict-markers -m "not heavy"
